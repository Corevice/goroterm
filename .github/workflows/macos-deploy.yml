name: macOS Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    # Apple の公証キューは空いてれば数分だが、混雑時は 1 時間超えることもある。
    # Build + pod install + notarytool wait + staple まで余裕を持たせて 180 分。
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Apple requires iOS 26 SDK (= Xcode 26) for all submissions after
      # 2026-04-28. Apply the same pinning to macOS for consistency.
      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd macos && pod install

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Developer ID certificate
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/developer_id.p12
          echo "$MACOS_DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | \
            grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build macOS app (Release, Developer ID signed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build macos --release --build-number="$BUILD_NUMBER"
          codesign -dv --verbose=4 build/macos/Build/Products/Release/Goroterm.app 2>&1 | head -20

      # Sparkle.framework の内部ヘルパー(XPC / Updater.app / Autoupdate)は
      # Sparkle 配布時の署名のままだと、公証に必要な Hardened Runtime + secure
      # timestamp + 自分の Developer ID を満たさず notarize が Invalid になる。
      # 内側から署名し直し、最後にアプリ本体を entitlements 維持で再シールする。
      - name: Re-sign Sparkle for notarization (hardened runtime)
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Goroterm.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$FW" ]; then echo "Sparkle.framework not found; skipping"; exit 0; fi
          ID="$MACOS_SIGNING_IDENTITY"
          V="$FW/Versions/Current"
          for xpc in "$V"/XPCServices/*.xpc; do
            [ -e "$xpc" ] && codesign --force --options runtime --timestamp --sign "$ID" "$xpc"
          done
          [ -e "$V/Autoupdate" ] && codesign --force --options runtime --timestamp --sign "$ID" "$V/Autoupdate"
          [ -e "$V/Updater.app" ] && codesign --force --options runtime --timestamp --sign "$ID" "$V/Updater.app"
          codesign --force --options runtime --timestamp --sign "$ID" "$FW"
          # Sparkle を触ったのでアプリ本体を再シール(元の entitlements を明示)
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$ID" "$APP"
          echo "=== verify nested Sparkle signatures ==="
          codesign --verify --strict --verbose=2 "$FW" 2>&1 | tail -3 || true
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3 || true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Package, notarize, and staple
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: bundle exec fastlane mac deploy

      - name: Sign update and generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DMG=$(ls build/macos/release/Goroterm-*.dmg | head -1)
          echo "Signing DMG: $DMG"
          # Sparkle 公式ツール(sign_update)を取得。EdDSA 署名を生成する。
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz -o sparkle.tar.xz
          mkdir -p sparkle && tar xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > ed_priv.txt
          SIGOUT=$(sparkle/bin/sign_update "$DMG" --ed-key-file ed_priv.txt)
          rm -f ed_priv.txt
          ED_SIG=$(printf '%s' "$SIGOUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LEN=$(printf '%s' "$SIGOUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIG" ] || [ -z "$LEN" ]; then echo "sign_update failed: $SIGOUT"; exit 1; fi
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//' | tr -d '[:space:]')
          BUILD=${{ github.run_number }}
          TAG=${GITHUB_REF_NAME}
          DMG_NAME=$(basename "$DMG")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG_NAME}"
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          printf '<?xml version="1.0" standalone="yes"?>\n<rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">\n  <channel>\n    <title>Goroterm</title>\n    <item>\n      <title>%s</title>\n      <pubDate>%s</pubDate>\n      <sparkle:version>%s</sparkle:version>\n      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n      <sparkle:minimumSystemVersion>11.0</sparkle:minimumSystemVersion>\n      <enclosure url="%s" sparkle:edSignature="%s" length="%s" type="application/octet-stream" />\n    </item>\n  </channel>\n</rss>\n' \
            "$VERSION" "$PUBDATE" "$BUILD" "$VERSION" "$URL" "$ED_SIG" "$LEN" > appcast-macos.xml
          echo "--- appcast-macos.xml ---"; cat appcast-macos.xml

      - name: Upload DMG and appcast to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/release/Goroterm-*.dmg
            appcast-macos.xml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $KEYCHAIN_PATH || true
