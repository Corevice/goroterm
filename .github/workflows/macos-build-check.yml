name: macOS Build Check

# 署名・公証・配布なしのコンパイル確認専用。
# Linux 開発環境では Swift をビルドできないため、macOS ネイティブコードに
# 触れたブランチを push した時点でコンパイルを検証する。
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-build-check.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd macos && pod install

      # Release 設定は Developer ID 署名を要求するが、このランナーには
      # 証明書がない。コンパイル確認が目的なのでアドホック署名に差し替える。
      - name: Switch Release signing to ad-hoc
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Developer ID Application";/CODE_SIGN_IDENTITY = "-";/' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/OTHER_CODE_SIGN_FLAGS = "--timestamp";/OTHER_CODE_SIGN_FLAGS = "";/' macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS app (Release, ad-hoc signed)
        run: flutter build macos --release
